# Daedalus 配置示例（复制成 config.toml 后修改；**凭据不要写在这里**）
# 键名与 src/daedalus/config.py 的 DEFAULTS 一一对应（只有一层映射）

[fetcher]
user_agent = ""   # 空 = 用默认诚实 UA（说明是本工具）
per_domain_concurrency = 5   # 每域并发（建议 4–8）
per_domain_qps = 1.0   # 每域 QPS（建议 1–2，按目标站 ToS 调）
respect_robots = true   # 关掉它请先想清楚（合规红线）
timeout = 15.0   # 单请求超时（秒）

[sanitization]   # 每一项：true = 这一类**做脱敏**；false = 输出原文
# 原始层（raw artifact）永不脱敏且不可配置（脱了就不能重放）
# 运行态 URL / Cookie 不脱敏（脱了会让续爬续下 403）
log_url = true
log_headers = true
log_text = true
export_record = false
derived_records = false
db_headers = true
ui_view = false

[logging]
level = "INFO"   # DEBUG / INFO / WARNING / ERROR
dir = ""   # 空 = 只控制台；给目录则写文件（UTF-8 + 轮转）
json = true   # true = 结构化 JSON 行（字段稳定，可 jq / 可回归对比）
max_bytes = 10485760
backup_count = 5

[alerts]   # 告警阈值（默认有值；GUI/CLI 会据此把指标标红）
queue_depth_pct = 80.0   # 队列深度占上限的百分比
failure_rate_pct = 20.0   # 失败率上限（%）
disk_free_pct = 10.0   # 数据盘剩余空间下限（%）
rss_mb = 3072.0   # 常驻内存上限（MB）
latency_p95_ms = 5000.0   # 请求 p95 延迟上限（ms）

[paths]
data_root = ""   # 空 = 用户级目录（环境变量 DAEDALUS_DATA_ROOT 优先）

[limits]   # 资源计划：队列全有界、池显式容量、内存按算术核对（core/limits.py）
download_threads = 128
per_domain_concurrency = 8
parse_threads = 20
reparse_processes = 12
writer_threads = 1
subprocess_slots = 4
browser_contexts = 0
browser_pages = 0
queue_frontier = 200000
queue_download_parse = 10000
queue_parse_store = 20000
queue_writer = 20000
batch_rows = 1000
flush_interval = 1.0
peak_download_mb = 8.0
peak_parse_mb = 48.0
peak_browser_mb = 300.0
memory_budget_mb = 4096.0
# 内存自证：Σ(池规模 × 单任务峰值) ≤ memory_budget_mb（改了任一数字都要重算）
